# jetson-nano-board: overrides Omarchy's 10-omarchy.conf (50% for 20 s) for a 4 GB board with an
# SD-card root. Omarchy's reasoning holds: act on PSI stall time, and once the desktop is unusable
# losing one app is the cheaper outcome. On this board it is unusable well before 20 s, and the
# kernel OOM killer can fire first (it took the session down once), so act after 5 s at 40%.
# Named 20- so it sorts after 10-omarchy.conf. Eligible cgroups: Omarchy's app.slice drop-in.
[OOM]
DefaultMemoryPressureLimit=40%
DefaultMemoryPressureDurationSec=5s
