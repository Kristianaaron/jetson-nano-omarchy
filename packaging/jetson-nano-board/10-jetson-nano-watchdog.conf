# jetson-nano-board: arm the MAX77620 PMIC watchdog. If the system freezes so hard that systemd
# can no longer pet it, the PMIC resets the board by itself, and a reboot or a kexec that hangs is
# cut short the same way: no one has to pull the power. (systemd disarms the watchdog for kexec by
# default; a kexec boot that hung there left the board dead until a power cycle.)
[Manager]
RuntimeWatchdogSec=60s
RebootWatchdogSec=2min
KExecWatchdogSec=2min
