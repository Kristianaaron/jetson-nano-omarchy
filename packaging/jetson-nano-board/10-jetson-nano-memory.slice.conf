# jetson-nano-board: keep memory for the logged-in user's desktop under pressure. With
# memory_recursiveprot, protection only reaches the session if every ancestor carries it
# (user.slice, user-UID.slice, user@UID.service, session.slice), so each level sets it.
# System services (package builds, updates) are reclaimed first.
[Slice]
MemoryLow=1G
