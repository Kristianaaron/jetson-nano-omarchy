# jetson-nano-board: with 4 GB of memory the kernel OOM killer can pick one desktop helper (the bar,
# a portal). systemd's default OOMPolicy=stop then stops the whole session unit and every app in
# it. Let the session continue: the compositor or the helper's own unit restarts what was killed,
# and if the compositor itself is killed the unit ends anyway.
[Service]
OOMPolicy=continue
