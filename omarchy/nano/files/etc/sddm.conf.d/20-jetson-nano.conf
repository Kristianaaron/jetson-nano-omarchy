# Jetson Nano (Tegra210): Mesa 26.2 tegra_dri (the tegra-drm + nouveau wrapper)
# segfaults on first render; nouveau alone renders fine. Until that is fixed the
# greeter and its compositor use software rendering (llvmpipe). NOT GPU.
[General]
GreeterEnvironment=MESA_LOADER_DRIVER_OVERRIDE=kms_swrast,LIBGL_ALWAYS_SOFTWARE=1

[Wayland]
CompositorCommand=env MESA_LOADER_DRIVER_OVERRIDE=kms_swrast AQ_DRM_DEVICES=/dev/dri/by-path/platform-50000000.host1x-card start-hyprland -- --config /usr/share/sddm/hyprland.lua
