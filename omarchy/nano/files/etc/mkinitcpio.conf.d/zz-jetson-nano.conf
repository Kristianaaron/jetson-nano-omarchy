# Jetson Nano: the initramfs must stay under the 14 MiB gap L4T U-Boot leaves
# below kernel_addr_r. i2c-tegra brings up the PMIC rail the SD card needs; ramoops keeps a panic
# log across the reboot from early boot on (reserve_mem on the kernel command line).
MODULES=(i2c-tegra ramoops)
HOOKS=(base systemd autodetect modconf block filesystems fsck)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
# xhci-tegra is built in and probes before root is mounted; its firmware must be
# in the initramfs or USB (keyboard, mouse) never comes up.
FILES=(/usr/lib/firmware/nvidia/tegra210/xusb.bin)
